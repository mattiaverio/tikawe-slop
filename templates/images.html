{% extends "layout.html" %}

{% block title %}Reitin kuvat{% endblock %}

{% block content %}
<h2>Reitin {{ route.title }} kuvat</h2>

{% if images %}
<form action="/remove_images" method="post">
  {% for image in images %}
  <p>
    <input type="checkbox" name="image_id" id="image{{ image.id }}" value="{{ image.id }}" />
    <label for="image{{ image.id }}">Valitse poistettavaksi</label> <br />
    <img src="/image/{{ image.id }}" alt="Kuva reitiltä {{ route.title }}" />
  </p>
  {% endfor %}
  <input type="hidden" name="route_id" value="{{ route.id }}" />
  <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
  <input type="submit" value="Poista valitut kuvat" />
</form>
{% else %}
<p>
  Reitillä ei ole vielä kuvia.
</p>
{% endif %}

<h3>Lisää uusi kuva</h3>

<form action="/add_image" method="post" enctype="multipart/form-data">
  <p>
    <label for="image">Kuva (png-tiedosto, enintään 100 kt)</label>: <br />
    <input type="file" name="image" id="image" accept=".png" required />
  </p>
  <input type="hidden" name="route_id" value="{{ route.id }}" />
  <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
  <input type="submit" value="Lähetä kuva" />
</form>

<p>
  <a href="/route/{{ route.id }}">Takaisin reittiin</a>
</p>
{% endblock %}
