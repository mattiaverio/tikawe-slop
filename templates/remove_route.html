{% extends "layout.html" %}

{% block title %}Reitin poisto{% endblock %}

{% block content %}
<h2>Reitin poisto</h2>

<p>
  Haluatko varmasti poistaa reitin <strong>{{ route.title }}</strong>?
  Myös reitin kuvat ja kommentit poistetaan.
</p>

<form action="/remove_route/{{ route.id }}" method="post">
  <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
  <input type="submit" name="remove" value="Poista reitti" />
  <input type="submit" name="continue" class="secondary" value="Peruuta" />
</form>
{% endblock %}
