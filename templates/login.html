{% extends "layout.html" %}

{% block title %}Kirjautuminen{% endblock %}

{% block content %}
<h2>Kirjautuminen</h2>

<form action="/login" method="post">
  <p>
    <label for="username">Tunnus</label>: <br />
    <input type="text" name="username" id="username" maxlength="16" required />
  </p>
  <p>
    <label for="password">Salasana</label>: <br />
    <input type="password" name="password" id="password" maxlength="100" required />
  </p>
  <input type="submit" value="Kirjaudu sisään" />
</form>

<p>
  Eikö sinulla ole vielä tunnusta? <a href="/register">Luo tunnus</a>
</p>
{% endblock %}
