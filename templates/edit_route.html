{% extends "layout.html" %}

{% block title %}Reitin muokkaus{% endblock %}

{% block content %}
<h2>Reitin muokkaus</h2>

<form action="/update_route" method="post">
  <p>
    <label for="title">Nimi</label>: <br />
    <input type="text" name="title" id="title" value="{{ route.title }}" size="40" maxlength="50" required />
  </p>
  <p>
    <label for="description">Kuvaus</label>: <br />
    <textarea name="description" id="description" rows="8" cols="60" maxlength="2000" required>{{ route.description }}</textarea>
  </p>
  <p>
    <label for="length_km">Pituus (km)</label>: <br />
    <input type="text" name="length_km" id="length_km" value="{{ route.length_km }}" size="8" pattern="[1-9][0-9]{0,2}" title="Kokonaisluku väliltä 1–999" required />
  </p>
  {% for class in all_classes %}
  <p>
    <label for="class{{ loop.index }}">{{ class }}</label>: <br />
    <select name="classes" id="class{{ loop.index }}">
      <option value="">(valitse)</option>
      {% for option in all_classes[class] %}
      {% if classes[class] == option %}
      <option value="{{ class }}:{{ option }}" selected>{{ option }}</option>
      {% else %}
      <option value="{{ class }}:{{ option }}">{{ option }}</option>
      {% endif %}
      {% endfor %}
    </select>
  </p>
  {% endfor %}
  <input type="hidden" name="route_id" value="{{ route.id }}" />
  <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
  <input type="submit" value="Tallenna muutokset" />
</form>

<p>
  <a href="/route/{{ route.id }}">Takaisin reittiin</a>
</p>
{% endblock %}
